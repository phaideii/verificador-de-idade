<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Idade</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Verificador de Idade</h1>
    </header>

    <section>
        <div>
            <p>Ano de nascimento:
                <input type="number" name="textano" id="txtano" min="0">
            </p>
            <p>Sexo:
                <input type="radio" name="radsex" id="fem" checked>
                <label for="fem">Feminino</label>
                <input type="radio" name="radsex" id="mas">
                <label for="mas">Masculino</label>
                <input type="radio" name="radsex" id="ni" checked>
                <label for="fem">Não informar</label>
            </p>
            <p>
                <input type="button" value="Verificar" onclick="verificar()">
            </p>
        </div>

        <div id="res">
            <i>Preencha os dados acima para ver o resultado!</i>
        </div>
    </section>

    <footer>
        <p>&copy;peneloop</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
